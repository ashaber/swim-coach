# Lever policy for interval progression (library/48-stimulus-progression.md, "Lever model").
#
# A session in an intensity zone is described by four levers: rep size, rest, reps per set, sets.
# Progression moves ONE lever one step from the last cleanly completed session. This file holds the
# starting shapes, the step rules, the per-session ceilings and the threshold-change rule. It is data:
# a coach can override any part per athlete (LeverPolicy.load(overrides=...)) without a code change.
#
# Amounts: "8 min", "15 s", "100 m" (a bare number is already in the unit: seconds or metres).
# Direction is the direction that PROGRESSES the lever (rest goes down, the others go up).
# Order of the `levers` list is the default preference order and nothing more.
#
# Evidence: no study compares these levers as progression steps. The per-session `ceiling` work values
# cite the tested protocols they come from; every other number is `Coach judgment:`.
schema_version: 1
groups:
  bike:
    retest_archetypes: [ramp_test, test_2x20]
    rebase:
      min_change_pct: 2.0
      steps_per_pct: 0.5
      basis: "Coach judgment: a threshold rise of 2% or more restarts the climb; each 1% of rise drops it half a step (a 4% rise restarts 2 steps lower)."
    zones:
      Z3:
        entry: "2x8 min/4 min Z3"
        levers:
          - lever: rep_size
            step: {values: [8 min, 10 min, 12 min, 15 min, 20 min]}
            basis: "Coach judgment: tempo reps lengthen 8, 10, 12, 15, 20 min."
          - lever: rest
            step: {add: 1 min}
            min: 2 min
            max: 5 min
            basis: "Coach judgment: shorter rest is tolerated as the athlete adapts; between 2 and 5 min."
          - lever: reps
            step: {add: 1}
            max: 3
            basis: "Coach judgment: up to 3 reps per tempo set."
        ceiling:
          - work: 60 min
            source: "Coach judgment: 3 x 20 min of tempo."
        max_rep_size: 20 min
        promote_to: {zone: Z4}
      Z4:
        entry: "2x(3x3 min/1 min)/5 min Z4"
        levers:
          - lever: rep_size
            step: {values: [3 min, 4 min, 5 min, 6 min, 8 min, 10 min, 12 min, 15 min, 20 min]}
            basis: "Coach judgment: threshold reps lengthen from 3 up to 20 min."
          - lever: rest
            step: {add: 1 min}
            min: 1 min
            max: 5 min
            basis: "Coach judgment: shorter rest as the athlete adapts; between 1 and 5 min."
          - lever: consolidate
            max_work_gain_pct: 15
            basis: "Coach judgment: broken threshold becomes fewer, longer reps (3 x 3 min becomes 2 x 5 min), adding at most 15% work."
          - lever: reps
            step: {add: 1}
            max: 4
            basis: "Coach judgment: up to 4 reps per set."
          - lever: sets
            step: {add: 1}
            max: 3
            set_rest: 5 min
            basis: "Coach judgment: up to 3 sets, 5 min between sets."
        ceiling:
          - work: 40 min
            source: "Coach judgment: 2 x 20 min, the top of the athlete's own threshold pattern. Research tested protocols are shorter: Seiler et al. 2013 used 4 x 8 min (32 min) and Baron et al. 2003 had trained cyclists ride 30 min at maximal lactate steady state, so work past about 32 min rests on coach judgment."
        max_rep_size: 20 min
        promote_to: {retest_threshold: true}
      Z5:
        entry: "6x15 s/15 s Z5"
        levers:
          - lever: rep_size
            step: {values: [15 s, 20 s, 30 s, 40 s]}
            basis: "Coach judgment: on-time lengthens 15, 20, 30, 40 s."
          - lever: reps
            step: {values: [6, 8, 10, 13]}
            basis: "Coach judgment: 6, 8, 10 reps; 13 is the rep count of the tested 30 s on / 15 s off protocol."
          - lever: sets
            step: {add: 1}
            max: 3
            set_rest: 3 min
            basis: "Coach judgment: up to 3 sets; 3 min between sets as in the tested protocol."
        ceiling:
          - rep_size_up_to: 40 s
            work: 19.5 min
            source: "Ronnestad et al. 2015, 2020: 3 sets of 13 x 30 s on / 15 s off (19.5 min of on-time) beat effort-matched 4 x 5 min in cyclists."
          - rep_size_up_to: 5 min
            work: 20 min
            source: "Seiler et al. 2013 (4 x 4 min) and Ronnestad et al. 2015 (4 x 5 min): 16 to 20 min of long VO2 reps."
        max_rep_size: 5 min
        promote_to: {retest_threshold: true}
  swim:
    retest_archetypes: []
    rebase:
      min_change_pct: 1.5
      steps_per_pct: 1.0
      basis: "Coach judgment: a CSS improvement of 1.5% or more restarts the climb; each 1% drops it one step."
    zones:
      Z3:
        entry: "4x200 m/20 s Z3"
        levers:
          - lever: rep_size
            step: {values: [200 m, 300 m, 400 m, 600 m, 800 m]}
            basis: "Coach judgment: tempo reps lengthen 200 to 800 m."
          - lever: rest
            step: {add: 5 s}
            min: 10 s
            max: 30 s
            basis: "Coach judgment: rest shortens 5 s at a time, between 10 and 30 s."
          - lever: reps
            step: {add: 1}
            max: 8
            basis: "Coach judgment: up to 8 reps."
        ceiling:
          - work: 3200 m
            source: "Coach judgment: 4 x 800 m of tempo."
        max_rep_size: 800 m
        promote_to: {zone: Z4}
      Z4:
        entry: "8x100 m/15 s Z4"
        levers:
          - lever: rep_size
            step: {values: [100 m, 150 m, 200 m, 300 m, 400 m]}
            basis: "Coach judgment: threshold reps lengthen 100 to 400 m."
          - lever: rest
            step: {add: 5 s}
            min: 10 s
            max: 30 s
            basis: "Coach judgment: rest shortens 5 s at a time, between 10 and 30 s."
          - lever: consolidate
            max_work_gain_pct: 15
            basis: "Coach judgment: broken sets become fewer, longer reps (8 x 100 m becomes 4 x 200 m), adding at most 15% work."
          - lever: reps
            step: {add: 2}
            max: 16
            basis: "Coach judgment: up to 16 reps per set."
          - lever: sets
            step: {add: 1}
            max: 3
            set_rest: 60 s
            basis: "Coach judgment: up to 3 sets, 60 s between sets."
        ceiling:
          - work: 4000 m
            source: "Dekerle et al. 2010: 10 x 400 m at critical swimming speed with 40 s recovery kept blood lactate stable in nine competitive male swimmers (abstract level)."
        max_rep_size: 400 m
        promote_to: {retest_threshold: true}
      Z5:
        entry: "8x50 m/20 s Z5"
        levers:
          - lever: rep_size
            step: {values: [50 m, 75 m, 100 m, 150 m, 200 m]}
            basis: "Coach judgment: VO2 reps lengthen 50 to 200 m."
          - lever: reps
            step: {values: [8, 10, 12, 16]}
            basis: "Coach judgment: 8, 10, 12, 16 reps."
          - lever: sets
            step: {add: 1}
            max: 3
            set_rest: 90 s
            basis: "Coach judgment: up to 3 sets, 90 s between sets."
        ceiling:
          - work: 1200 m
            source: "Coach judgment: 12 x 100 m of VO2 pace."
        max_rep_size: 200 m
        promote_to: {retest_threshold: true}
