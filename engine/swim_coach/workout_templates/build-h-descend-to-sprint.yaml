narrative_template: "Main set: {reps} x {rep}m broken-distance, descend 1-{reps} from Z3 ({z3_range}) toward Z4 ({z4_range}) by the final rep, negative-split each repeat -- echoes Descend to Sprint's descend-by-100 pattern, repeated across free, pull, and kick rounds -- race-pace-adjacent emphasis ({macro_block_name} block)."
source_note: "Adapted from a workout published by Matt Donovan, U.S. Masters Swimming (usms.org), 'Best Sprint Workouts for Swimming Faster', May 5, 2021 (Workout 4, Descend to Sprint)."
