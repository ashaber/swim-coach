file: 38-race-week-sharpener-and-openers.md
added: 2026-10-10
cards:
- section: the-sharpener-about-3-4-days-before-a-priority-race
  heading: The sharpener (about 3-4 days before a priority race)
  summary: A short ~60 min sharpener (IF ~0.65-0.75, TSS ~45-60) is the last real stimulus, applying the cut-volume-hold-intensity
    taper principle (Mujika & Padilla 2003; Bosquet 2007); figures are practitioner shapes.
  recommendation: Program one small sharpener 3-4 days out and shrink or move it earlier if the athlete arrives flat.
  content_hash: dc55e7eb2dc88f0f4eb84e1d64816a4854a2ebfad3cf800917ef0062031ed45b
- section: the-openers-the-day-before-the-race
  heading: The openers (the day before the race)
  summary: Openers (~20-40 min, a few short builds to race pace) wake the legs the day before and are distinct from the sharpener;
    neither replaces the other.
  recommendation: Keep openers very low load and never hard enough to be a stimulus; still schedule the sharpener.
  content_hash: d6ec07d67e9908d09d107b07e3cc3470183f719379d71edfadeefa0f3b1aca47
- section: race-day-warm-up-cx-short-course-race
  heading: Race-day warm-up (CX / short-course race)
  summary: Match warm-up to event class. Short maximal-start races need 2+ race-pace efforts (~90-96% FTP) plus openers; mid-length lighter; ultra easy spin only. Watt bands, timed steps.
  recommendation: Author the race warm-up as its own warmup session with race-pace efforts and watt bands on every step.
  content_hash: ed7de4d46ca52127ff774ddb5b43050bd6043895f1d097c54ab4187b6f0f2821
- section: the-cyclocross-hard-start
  heading: The cyclocross "hard start"
  summary: 'Coach judgment: rehearse lap 1 as one continuous 10-20 s all-out launch straight into 2-4 min at threshold/race
    pace, not separate starts plus separate VO2 intervals.'
  recommendation: Write the hard start as a single continuous effort with no easing between launch and threshold.
  content_hash: 70a80fed2275a8ebf5675a581827e318d01723c018dbfffeab184a0a29e10e79
- section: the-8-week-ramp-rail-in-a-race-week
  heading: The +8%/week ramp rail in a race week
  summary: Race days and warm-ups inflate race-week minutes, so the build-phase +8%/week minutes rail is low-signal there;
    a TSS-based bike rail is a future idea and plan_check is unchanged.
  recommendation: Surface the rail finding in a race week but call it low-signal rather than rewriting a sound taper.
  content_hash: 34d8de2843fb9c01d3b7224a1369ac2173c82b6adffef4d2a58f761a6b124025
- section: writing-starts-and-technical-course-reps
  heading: Writing starts and technical-course reps
  summary: 'Coach judgment: write starts as timed steps equal to the intended hold, followed by lap-key recoveries; a weak
    start is a post-ride skill read, not a stop signal; score technical reps by HR vs LTHR.'
  recommendation: Author timed start steps with lap-key recoveries; treat one weak start as a skill rep and only consecutive
    or declining weak starts as fatigue.
  content_hash: 63b5797b1d1ffc53f333e49809203ae64657c566e0fff67f2966ee3fd27b07cc
- section: how-the-analyzer-reads-these-sessions
  heading: How the analyzer reads these sessions
  summary: 'Coach judgment constants behind the analyzer: double-burst starts, weak-start classification, HR-scored technical
    reps, lap-shape detection without a plan, the race-start read, and no decoupling on interval, starts or race rides.'
  recommendation: Read the per-start burst table, technical-rep HR numbers and race-start block as the analyzer's objective
    output; treat the thresholds as fitted to a few real rides, not cited values.
  content_hash: 2fc918a6691be7e43e29344ee01addd03c7558028db5ead2a7901893846a1b61
- section: reading-a-start-trace
  heading: Reading a start trace
  summary: 'Coach judgment: each start carries a 1 Hz trace and phase read; the bands, thresholds and cue table live in library
    39.'
  recommendation: Quote the start's phases and defer to library 39 for bands and practice cues.
  content_hash: 803825435c38a069f84dc9c9251ecaf8b8a13a6d78aaea46943d4388387ec442
