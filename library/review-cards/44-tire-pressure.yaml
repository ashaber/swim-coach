cards:
- section: 1-breakpoint-impedance-and-why-drums-mislead-unreviewed
  heading: 1. Breakpoint, impedance and why drums mislead (UNREVIEWED)
  summary: Higher pressure stops being faster above a breakpoint on real surfaces; smooth drums cannot show it, so drum rankings
    overstate high pressure.
  recommendation: Explain breakpoint and that drum data show casing efficiency, not the best real-surface pressure.
  content_hash: 3761fc8d2e51480d6f428184a50f09aa09858300295051928ed0b8328365ac11
- section: 2-virtual-elevation-chung-method-what-it-is-and-its-limits-unreviewed
  heading: '2. Virtual elevation (Chung method): what it is and its limits (UNREVIEWED)'
  summary: Virtual elevation is a field method for finding pressure effects; Silca endorses it and Heine disputes it. A few
    watts is noise.
  recommendation: Describe both sides and treat small differences as noise.
  content_hash: 6a816c5eae052ba056266e059bb5ee004cccc95ef6478af38ee4deed3629e279
- section: 3-test-results-that-exist-unreviewed
  heading: 3. Test results that exist (UNREVIEWED)
  summary: Soft-gravel, gravel, roll-down and rim-width results exist, all test conditions. None is at CX widths; too low
    (15 psi) lost too.
  recommendation: Never quote a test pressure as advice; state its surface, width and source.
  content_hash: b6dd7f88c4118c301f744115f678aca80c4628443aed6401daceee9178b1ed8c
- section: 4-road-cx-and-mtb-what-is-and-is-not-sourced-unreviewed
  heading: '4. Road, CX and MTB: what is and is not sourced (UNREVIEWED)'
  summary: Road has only calculator outputs, CX 30-35 psi is withdrawn, tubular statements are untested, and no MTB pressure
    is sourced.
  recommendation: Give no default CX, road or MTB pressure; point to the athlete's own log and the protocol.
  content_hash: dd5f5f4e431eec01d0c778c57a34c78b790a09b9d4643c3b1bd0765a4b108637
- section: 5-limits-and-practical-factors-coach-judgment-unless-sourced
  heading: 5. Limits and practical factors (`Coach judgment:` unless sourced)
  summary: Hookless maxima are ceilings; floors are rim strikes, burps and squirm. Gauges differ; air temperature shifts pressure
    by arithmetic.
  recommendation: Obey the lower printed maximum, use one gauge and recheck pressure at venue temperature.
  content_hash: fcdfc0c1a0361ccdd2032c072e03443e14480ad62e32f1314bfaeb11cc4cd66b
- section: 6-field-protocol-find-your-own-best-pressure-unreviewed
  heading: '6. Field protocol: find your own best pressure (UNREVIEWED)'
  summary: A Chung-style loop protocol finds the athlete's own lowest pressure without strikes, burps or squirm; low-medium
    confidence.
  recommendation: Offer the protocol and have the athlete log pressures and results.
  content_hash: d451e0ac64a6bdcd1f083e4cc383d44f4584694751c27c27b66077893a7c48f9
